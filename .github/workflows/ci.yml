name: CI

on:
  push:
    branches: [ main, dev, 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake cppcheck

      - name: Apply libcsp patches
        run: bash scripts/apply_patches.sh

      - name: Configure
        run: mkdir -p build && cd build && cmake .. -DPICO_ENABLED=OFF

      - name: Build
        run: cd build && cmake --build . -- -j$(nproc)

      - name: Run tests
        run: cd build && ctest --output-on-failure

      - name: Static analysis
        run: bash scripts/static_analysis.sh

