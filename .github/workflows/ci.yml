name: CI

on:
  push:
    branches: [ main, dev, 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FATFS_INCLUDE: ${{ github.workspace }}/third_party/pico-sdk/lib/tinyusb/lib/fatfs/source
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake cppcheck
          # Install pinned clang-14 tools; fall back to LLVM apt repo on Ubuntu 24+
          sudo apt-get install -y clang-format-14 clang-tidy-14 || {
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 14
            sudo apt-get install -y clang-format-14 clang-tidy-14
          }

      - name: Apply libcsp patches
        run: bash scripts/apply_patches.sh

      - name: Configure
        run: mkdir -p build && cd build && cmake .. -DPICO_ENABLED=OFF

      - name: Build
        run: cd build && cmake --build . -- -j$(nproc)

      - name: Run tests
        run: cd build && ctest --output-on-failure

      - name: List FatFs files
        run: |
          echo "FATFS_INCLUDE=$FATFS_INCLUDE"
          ls -l $FATFS_INCLUDE/ff.h || echo "ERROR: ff.h not found"

      - name: Debug submodules
        run: |
          git submodule status --recursive | head -40
          ls third_party/ || echo "third_party/ empty"
          ls third_party/pico-sdk/ 2>/dev/null || echo "pico-sdk not cloned"
          ls third_party/pico-sdk/lib/ 2>/dev/null || echo "pico-sdk/lib empty"
          ls third_party/pico-sdk/lib/tinyusb/ 2>/dev/null || echo "tinyusb not cloned"

      - name: Static analysis
        run: bash scripts/static_analysis.sh

