name: CI

on:
  push:
    branches: [ main, dev, 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-analyze:
    runs-on: ubuntu-22.04
    env:
      FATFS_INCLUDE: ${{ github.workspace }}/third_party/pico-sdk/lib/tinyusb/lib/fatfs/source
      CC: gcc-11
      CXX: g++-11

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-clang14-cmake

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake cppcheck
          sudo apt-get install -y clang-format-14 clang-tidy-14 || {
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 14
            sudo apt-get install -y clang-format-14 clang-tidy-14
          }

      - name: Apply libcsp patches
        run: bash scripts/apply_patches.sh

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt', 'scripts/apply_patches.sh', 'src/**/*.c', 'src/**/*.h', 'include/**/*.h', 'tests/**/*.c') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Configure
        run: cmake -S . -B build -DPICO_ENABLED=OFF -DCMAKE_C_COMPILER=/usr/bin/gcc-11 -DCMAKE_CXX_COMPILER=/usr/bin/g++-11

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Rebuild GPS test to ensure fresh binary
        run: cmake --build build --target test_gps_neo7m -- -j1

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Static analysis
        run: bash scripts/static_analysis.sh

      - name: Upload firmware
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: artifacts/*.uf2

  # =============================================================================
  # Coverity Scan — Deep static analysis via Coverity Scan (free for OSS)
  # =============================================================================
  # CDR-SAF-05: Coverity static analysis integration in CI pipeline
  # FMEA OI-SW-4: Coverity analysis integration in CI pipeline
  #
  # Setup (one-time):
  #   1. Sign up at https://scan.coverity.com/projects/cubesat-obc
  #   2. Register this repo: cubesat-obc (public repos auto-detected)
  #   3. Add these secrets to the repo:
  #      https://github.com/<owner>/<repo>/settings/secrets/actions
  #      - COVERITY_SCAN_EMAIL: email used to register on Coverity Scan
  #      - COVERITY_SCAN_TOKEN: token from Coverity Scan project settings
  #
  # IMPORTANT: CMake must use Unix Makefiles (not Ninja) because the
  # vapier/coverity-scan-action runs `make` by default. The configure step
  # below sets -G "Unix Makefiles" specifically for this job.
  #
  # Runs on: main and dev branch pushes only (skip on PRs to reduce load)
  # =============================================================================
  coverity-scan:
    needs: build-test-analyze
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply libcsp patches
        run: bash scripts/apply_patches.sh

      - name: Configure CMake for Coverity
        run: |
          cmake -S . -B build_cov \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPICO_ENABLED=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -Wno-dev

      - name: Run Coverity Scan
        uses: vapier/coverity-scan-action@v1
        with:
          email: ${{ secrets.COVERITY_SCAN_EMAIL }}
          token: ${{ secrets.COVERITY_SCAN_TOKEN }}
          project: cubesat-obc
          # Use the CMake-generated Makefile in build_cov/
          command: make
          working-directory: build_cov
          # Informational: describe this build in Coverity dashboard
          description: "CubeSat OBC ${{ github.ref_name }} @ ${{ github.sha }}"

      - name: Upload Coverity artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverity-results
          path: |
            artifacts/coverity_scan.log